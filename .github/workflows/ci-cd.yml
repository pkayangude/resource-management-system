name: CI/CD – Resource Management System

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  DOTNET_VERSION: '8.0.x'
  API_PROJECT:  src/ResourceManagement.API/ResourceManagement.API.csproj
  WEB_PROJECT:  src/ResourceManagement.Web/ResourceManagement.Web.csproj
  TEST_PROJECT: tests/ResourceManagement.Tests/ResourceManagement.Tests.csproj
  SOLUTION:     ResourceManagement.sln

jobs:
  # ─────────────────────────── BUILD & TEST ────────────────────────────────────
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore ${{ env.SOLUTION }}

      - name: Build solution (Release)
        run: dotnet build ${{ env.SOLUTION }} --configuration Release --no-restore

      - name: Run unit tests
        run: |
          dotnet test ${{ env.TEST_PROJECT }} \
            --configuration Release \
            --no-build \
            --logger "trx;LogFileName=test-results.trx" \
            --results-directory ./test-results

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: ./test-results/
          retention-days: 7

  # ─────────────────────────── SECURITY SCAN ───────────────────────────────────
  security-scan:
    name: Security & Dependency Scan
    runs-on: ubuntu-latest
    needs: build-test
    permissions:
      security-events: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore ${{ env.SOLUTION }}

      - name: Run dotnet vulnerability audit
        run: dotnet list ${{ env.SOLUTION }} package --vulnerable --include-transitive 2>&1 | tee vuln-report.txt || true

      - name: Check for critical vulnerabilities
        run: |
          if grep -i "Critical" vuln-report.txt; then
            echo "::error::Critical vulnerabilities found!"
            exit 1
          fi

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: csharp

      - name: Build for CodeQL
        run: dotnet build ${{ env.SOLUTION }} --configuration Release --no-restore

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  # ─────────────────────────── PUBLISH API ─────────────────────────────────────
  publish-api:
    name: Publish API
    runs-on: ubuntu-latest
    needs: [build-test, security-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION }}

      - name: Publish API
        run: |
          dotnet publish ${{ env.API_PROJECT }} \
            --configuration Release \
            --output ./publish/api \
            --no-restore

      - name: Upload API artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-publish
          path: ./publish/api
          retention-days: 30

  # ─────────────────────────── PUBLISH WEB ─────────────────────────────────────
  publish-web:
    name: Publish Web (Blazor WASM)
    runs-on: ubuntu-latest
    needs: [build-test, security-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION }}

      - name: Publish Web
        run: |
          dotnet publish ${{ env.WEB_PROJECT }} \
            --configuration Release \
            --output ./publish/web \
            --no-restore

      - name: Upload Web artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-publish
          path: ./publish/web
          retention-days: 30

  # ─────────────────────────── DOCKER BUILD ────────────────────────────────────
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [publish-api, publish-web]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Docker image
        run: |
          docker build \
            -f src/ResourceManagement.API/Dockerfile \
            -t resource-management-api:${{ github.sha }} \
            -t resource-management-api:latest \
            .

      - name: Scan image for vulnerabilities
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image \
            --exit-code 1 \
            --severity CRITICAL \
            resource-management-api:latest || echo "Trivy scan completed"

  # ─────────────────────────── EF MIGRATION CHECK ──────────────────────────────
  migration-check:
    name: EF Migration Validation
    runs-on: ubuntu-latest
    needs: build-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION }}

      - name: Install EF tools
        run: dotnet tool install --global dotnet-ef --version 8.*

      - name: Validate EF migrations (dry run)
        run: |
          dotnet ef migrations list \
            --project src/ResourceManagement.Infrastructure \
            --startup-project src/ResourceManagement.API \
            --no-build || echo "EF tools check complete"
